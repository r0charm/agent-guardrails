name: checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    # macOS runs the guards under its system bash 3.2, which is what
    # `/usr/bin/env bash` finds on a Mac without Homebrew bash first on PATH.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Runs the opencode and Pi wiring, which is TypeScript.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Guard suite
        run: scripts/test
      - name: shellcheck
        if: runner.os == 'Linux'
        # rules files are sourced, so the variables they set look unused.
        run: |
          shellcheck scripts/guard scripts/test
          shellcheck -s bash -e SC2034 guards/*/rules
